<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Маленький герой</title>
  <meta name="description" content="Тёплая персональная страница с фотографией мальчика." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg1:#84fab0;--bg2:#8fd3f4;--ink:#172033;--card:rgba(255,255,255,.78);--accent:#ff8a3d}
    *{box-sizing:border-box} body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));overflow-x:hidden}
    .bubbles span{position:fixed;border-radius:50%;background:rgba(255,255,255,.32);animation:float 12s infinite ease-in-out;z-index:0}.bubbles span:nth-child(1){width:120px;height:120px;left:8%;top:12%}.bubbles span:nth-child(2){width:70px;height:70px;right:12%;top:18%;animation-delay:1s}.bubbles span:nth-child(3){width:180px;height:180px;right:-40px;bottom:8%;animation-delay:2s}.bubbles span:nth-child(4){width:90px;height:90px;left:18%;bottom:10%;animation-delay:3s}@keyframes float{50%{transform:translateY(-28px) scale(1.05)}}
    main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(1040px,100%);display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;background:var(--card);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.55);border-radius:36px;padding:34px;box-shadow:0 28px 80px rgba(20,44,80,.22)}
    .photo{position:relative}.photo:before{content:"";position:absolute;inset:18px -14px -18px 14px;border-radius:34px;background:var(--accent);transform:rotate(3deg);z-index:-1}.photo img{width:100%;max-height:720px;object-fit:cover;border-radius:34px;display:block;box-shadow:0 22px 50px rgba(0,0,0,.24)}
    .text{padding:10px} .badge{display:inline-flex;gap:8px;align-items:center;background:#fff;border-radius:999px;padding:10px 16px;font-weight:900;color:#ff6b2b;box-shadow:0 10px 28px rgba(0,0,0,.1)}h1{font-size:clamp(42px,7vw,82px);line-height:.95;margin:24px 0 18px;font-weight:900;letter-spacing:-.05em}p{font-size:clamp(18px,2.1vw,25px);line-height:1.45;margin:0 0 26px}.chips{display:flex;flex-wrap:wrap;gap:12px}.chip{background:#172033;color:white;border-radius:18px;padding:12px 16px;font-weight:800}.chip:nth-child(2){background:#2f9eec}.chip:nth-child(3){background:#ff8a3d}.big-phrase{margin:26px 0 18px;font-size:clamp(44px,8vw,96px);line-height:.9;font-weight:900;text-transform:uppercase;letter-spacing:-.06em;color:#fff;text-shadow:0 6px 0 #172033,0 16px 35px rgba(0,0,0,.28)}.song-line{display:inline-block;margin:0 0 18px;padding:14px 18px;border-radius:22px;background:#fff;color:#172033;font-size:clamp(24px,4vw,48px);font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.16);transform:rotate(-2deg)}.play-btn{border:0;border-radius:999px;background:#ff3d6e;color:white;font:inherit;font-weight:900;padding:14px 20px;margin:4px 0 18px;cursor:pointer;box-shadow:0 12px 30px rgba(255,61,110,.35)}.footer{margin-top:30px;font-size:15px;opacity:.72}
    @media(max-width:820px){.card{grid-template-columns:1fr;padding:20px;border-radius:26px}.photo img{max-height:560px}.text{padding:2px}h1{font-size:44px}}
  </style>
</head>
<body>
  <div class="bubbles"><span></span><span></span><span></span><span></span></div>
  <main>
    <section class="card">
      <div class="photo"><img src="assets/boy.jpg" alt="Фото мальчика"></div>
      <div class="text">
        <div class="badge">⭐ Маленький герой</div>
        <div class="big-phrase">сельский волк нахуй</div>
        <div class="song-line">валим-валим на глинике 🔊</div>
        <button class="play-btn" onclick="startSong()">▶️ включить песню</button>
        <h1>Самая яркая улыбка дня</h1>
        <p>Тёплая страница с красивой фотографией, мягкими цветами и добрым настроением.</p>
        <div class="chips"><div class="chip">Смелый</div><div class="chip">Весёлый</div><div class="chip">Любимый</div></div>
        <div class="footer">Сделано с заботой 💛</div>
      </div>
    </section>
  </main>

  <script>
    let songStarted=false;
    function startSong(){
      if(songStarted) return; songStarted=true;
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const phrase='валим валим на глинике';
      function beat(t){
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(45,t+.18);
        g.gain.setValueAtTime(.28,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
        o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+.23);
      }
      function hat(t){
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='square'; o.frequency.value=900; g.gain.setValueAtTime(.045,t); g.gain.exponentialRampToValueAtTime(.001,t+.06);
        o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+.07);
      }
      let n=0; setInterval(()=>{const t=ctx.currentTime+.03; beat(t); hat(t+.25); hat(t+.5); hat(t+.75); if(n++%4===0 && 'speechSynthesis' in window){const u=new SpeechSynthesisUtterance(phrase); u.lang='ru-RU'; u.rate=1.08; u.pitch=.75; speechSynthesis.speak(u)}},900);
    }
    window.addEventListener('load',()=>setTimeout(startSong,500));
    document.addEventListener('click',startSong,{once:true});
  </script>
</body>
</html>
